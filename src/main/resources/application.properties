spring.application.name=veyra-backend

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:openrouter/free}
openrouter.image.model=${OPENROUTER_IMAGE_MODEL:google/gemini-2.5-flash-image-preview}

# Daily persona: one new story + generated avatar per day
veyra.daily.cron=${VEYRA_DAILY_CRON:0 0 23 * * *}
veyra.daily.zone=${VEYRA_DAILY_ZONE:Asia/Kolkata}

# Writable folder for generated stories and avatars
veyra.data.dir=${VEYRA_DATA_DIR:data}

# Optional token for POST /stories/daily. Empty = endpoint disabled.
veyra.admin.token=${VEYRA_ADMIN_TOKEN:}
